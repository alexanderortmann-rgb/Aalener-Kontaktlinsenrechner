<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontaktlinsenrechner</title>

    <!-- Globales CSS -->
    <link rel="stylesheet" href="Style_HTML.css">

    <style>
        /* Container für dynamisch geladene Seiten */
        #content {
            padding: 10px;
        }
    </style>

    <script src="general.js"></script>

    <script src="kl_rechner_tor.js"></script>
    <script src="kl_rechner_tor_Orga.js"></script>
    <script src="KL_Renderer.js"></script>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>



    
    <script src="hsa.js"></script>
    <script src="radien.js"></script>
    <script src="schiefe_cyl.js"></script>
    
    <script src="materialien.js"></script>
    <script src="fluobilder.js"></script>
    
    
</head>

<body>

    <!-- Navigation wird hier geladen -->
    <ul id="Links"></ul>

    <!-- Dynamischer Seitencontainer -->
    <div id="content"></div>

    <!-- Footer -->
    <footer>
        <span id="footer"></span>
    </footer>

    <script>

        /* Navigation laden */
        fetch('Links.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('Links').innerHTML = html;
                setupSPA(); // Navigation nach dem Laden aktivieren
            })
            .catch(err => console.error('Fehler beim Laden von Links.html:', err));

        /* Footer laden */
        fetch('footer.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('footer').innerHTML = html;
            })
            .catch(err => console.error('Fehler beim Laden von footer.html:', err));

        /* SPA-Light Navigation aktivieren */
        function setupSPA() {
            // Alle Links im Menü abfangen
            document.querySelectorAll('#Links a').forEach(link => {
                link.addEventListener('click', function (event) {
                    event.preventDefault(); // Kein Seitenreload
                    const page = this.getAttribute('href');
                    loadPage(page);
                });
            });

            // Startseite laden
            loadPage('Home.html'); 
        }

        // Führt eine Init-Funktion sicher aus: ein Fehler in einer Funktion
        // darf nicht verhindern, dass die restlichen Init-Funktionen laufen
        // (genau das ist vorhin beim Materialien-Dropdown passiert).
        function safeCall(fn, ...args) {
            try {
                if (typeof fn === 'function') fn(...args);
            } catch (err) {
                console.error(`Fehler in ${fn && fn.name ? fn.name : 'Init-Funktion'}:`, err);
            }
        }

        /* Seite dynamisch laden */
        function loadPage(page) {
            fetch(page)
                .then(r => r.text())
                .then(html => {
                    document.getElementById('content').innerHTML = html;

                    safeCall(restoreValues);               // Eingaben wiederherstellen
                    safeCall(initGeneralModalEvents);      // Modal-Schließen-Events
                    safeCall(initMaterialienModalEvents);  // Modal-Öffnen-Events-Materialien
                    safeCall(initFluoModalEvents);         // Modal-Öffnen-Events-Fluobilder

                    safeCall(initMobileInputs);
                    safeCall(initAxisInputs);
                    safeCall(initMueller);

                    if (page === 'KL Rechner Tor.html') {
                        safeCall(initKlRechnerTorEvents);
                        safeCall(initKlTorModalEvents);
                    }

                    if (page === 'KL_Renderer.html') {
                        safeCall(initKLUI);
                        safeCall(initKLRenderer);
                        safeCall(initRendererUI);
                    }

                    
                })
                .catch(err => console.error(`Fehler beim Laden von ${page}:`, err));
        }

        document.addEventListener("input", e => {
    if (e.target.id) {
        try {
            localStorage.setItem(e.target.id, e.target.value);
        } catch (err) {
            console.warn('localStorage nicht verfügbar, Eingabe wird nicht gespeichert:', err);
        }
    }
});

        function restoreValues() {
    let storageAvailable = true;
    document.querySelectorAll("[id]").forEach(el => {
        if (!storageAvailable) return;
        let val;
        try {
            val = localStorage.getItem(el.id);
        } catch (err) {
            console.warn('localStorage nicht verfügbar, gespeicherte Werte werden nicht wiederhergestellt:', err);
            storageAvailable = false;
            return;
        }
        if (val !== null) {
            if (
                el.tagName === "INPUT" ||
                el.tagName === "SELECT" ||
                el.tagName === "TEXTAREA"
            ) {
                el.value = val;
            } else {
                el.textContent = val;
            }
        }
    });
}


        


    </script>

</body>
</html>
