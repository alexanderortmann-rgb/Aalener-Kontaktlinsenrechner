<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontaktlinsenrechner</title>

    <!-- Globales CSS -->
    <link rel="stylesheet" href="Style_HTML.css">

    <style>
        /* Container für dynamisch geladene Seiten */
        #content {
            padding: 10px;
        }
    </style>

    <script src="general.js"></script>

    <script src="kl_rechner_tor.js"></script>
    <script src="kl_rechner_tor_Orga.js"></script>
    <script src="KL_Renderer.js"></script>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>



    
    <script src="hsa.js"></script>
    <script src="radien.js"></script>
    <script src="schiefe_cyl.js"></script>
    
    <script src="materialien.js"></script>
    <script src="fluobilder.js"></script>
    
    
</head>

<body>

    <!-- Navigation wird hier geladen -->
    <ul id="Links"></ul>

    <!-- Dynamischer Seitencontainer -->
    <div id="content"></div>

    <!-- Footer -->
    <footer>
        <span id="footer"></span>
    </footer>

    <script>

        /* Navigation laden */
        fetch('Links.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('Links').innerHTML = html;
                setupSPA(); // Navigation nach dem Laden aktivieren
            });

        /* Footer laden */
        fetch('footer.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('footer').innerHTML = html;
            });

        /* SPA-Light Navigation aktivieren */
        function setupSPA() {
            // Alle Links im Menü abfangen
            document.querySelectorAll('#Links a').forEach(link => {
                link.addEventListener('click', function (event) {
                    event.preventDefault(); // Kein Seitenreload
                    const page = this.getAttribute('href');
                    loadPage(page);
                });
            });

            // Startseite laden
            loadPage('Home.html'); 
        }

        /* Seite dynamisch laden */
        function loadPage(page) {
            fetch(page)
                .then(r => r.text())
                .then(html => {
                    document.getElementById('content').innerHTML = html;

                    restoreValues();               // Eingaben wiederherstellen
                    initGeneralModalEvents();      // Modal-Schließen-Events
                    initMaterialienModalEvents();  // Modal-Öffnen-Events-Materialien
                    initFluoModalEvents();         // Modal-Öffnen-Events-Fluobilder
                    //initKlTorModalEvents();        //Modal-Öffnen-Events-KL-Rechner-Tor
                    //initKlRechnerTorEvents();
                    
                    initMobileInputs();
                    initAxisInputs();
                    initMueller();

                    if (page === 'KL Rechner Tor.html') {
                        initKlRechnerTorEvents();
                        initKlTorModalEvents();
                    }

                    if (page === 'KL_Renderer.html') {
                        initKLRenderer();
                        initRendererUI();
                    }

                    
                });
        }

        document.addEventListener("input", e => {
    if (e.target.id) {
        localStorage.setItem(e.target.id, e.target.value);
    }
});

        function restoreValues() {
    document.querySelectorAll("[id]").forEach(el => {
        const val = localStorage.getItem(el.id);
        if (val !== null) {
            if (
                el.tagName === "INPUT" ||
                el.tagName === "SELECT" ||
                el.tagName === "TEXTAREA"
            ) {
                el.value = val;
            } else {
                el.textContent = val;
            }
        }
    });
}


        


    </script>

</body>
</html>
