<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="favicon.ico">
    <title>HSA Umrechner</title>
    
    <style>
   

.columnn {
    float: left;
    width: 45.0%;
    padding: 15px;
}
@media screen and (max-width:600px) {
    .columnn {
        width: 90%;
    }
}
ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #333;
}

li {
  float: left;
}

li a, .dropbtn {
  display: inline-block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}

li a:hover, .dropdown:hover .dropbtn {
  background-color: #111;
}

li.dropdown {
  display: inline-block;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #b6b6b6;
  min-width: 160px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
}

.dropdown-content a {
  color: black;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
  text-align: left;
}

.dropdown-content a:hover {background-color: #f1f1f1;}

.dropdown:hover .dropdown-content {
  display: block;
}


</style>
<link rel="stylesheet" href="Style_HTML.css">
</head>
<body>
	
	<ul id="Links"></ul>
    
    <br>
    <div class="container">
	<form>
    
    <h1>Kontaktlinsen und Hornhautvisualisierer</h1>

	<div class="tabHeader">
    <button type="button" class="tabButton" data-tab="tabHornhaut">Hornhaut</button>
    <button type="button" class="tabButton" data-tab="tabKL">Kontaktlinse</button>
	</div>


	<div class="tab" id="tabHornhaut">

    <h3>Hornhautparameter</h3>

    <label>Radius flach (mm)</label>
    <input type="number" id="R_flat" value="8" step="0.01">

    <label>Radius steil (mm)</label>
    <input type="number" id="R_steep" value="8" step="0.01">

    <label>Achse flach (°)</label>
    <input type="number" id="A_flat" value="0" step="1">

    <label>Achse steil (°)</label>
    <input type="number" id="A_steep" value="90" step="1">

    <label>Hornhautdurchmesser (mm)</label>
    <input type="number" id="cornea_diameter" value="12" step="0.01">

    <label>Pupillendurchmesser (mm)</label>
    <input type="number" id="pupil_diameter" value="3" step="0.01">

    <h4>Exzentrizität</h4>

    <select id="E_mode">
        <option value="direct">Direkteingabe</option>
        <option value="manual">Manuelle 4‑Meridian‑Messung</option>
        <option value="csv">CSV‑Import</option>
    </select>

    <div id="E_direct" class="E_block">
        <label>Exzentrizität (Q)</label>
        <input type="number" id="E_value" value="0.3" step="0.01">
    </div>

    <div id="E_manual" class="E_block hide">
        <label>Radius oben</label><input type="number" id="R_up" value="8" step="0.01">
        <label>Radius unten</label><input type="number" id="R_down" value="8" step="0.01">
        <label>Radius links</label><input type="number" id="R_left" value="8" step="0.01">
        <label>Radius rechts</label><input type="number" id="R_right" value="8" step="0.01">
    </div>

    <div id="E_csv" class="E_block hide">
        <label>Pentacam CSV laden</label>
        <input type="file" id="E_file" accept=".csv">
    </div>

</div>

		<div class="tab" id="tabKL">

    <h3>Kontaktlinsenparameter</h3>

    <label>Radius flach (mm)</label>
    <input type="number" id="KL_R_flat" value="8" step="0.01">

    <label>Radius steil (mm)</label>
    <input type="number" id="KL_R_steep" value="8" step="0.01">

    <h4>Sphäre / Zylinder</h4>

    <select id="KL_power_mode">
        <option value="sphcyl">Bestellwerte (Sph / Cyl / Achse)</option>
        <option value="backfront">Rückfläche / Vorderfläche</option>
    </select>

    <div id="KL_sphcyl" class="KL_block">
        <label>Sphäre</label><input type="number" id="KL_sph" value="0" step="0.25">
        <label>Zylinder</label><input type="number" id="KL_cyl" value="0" step="0.25">
        <label>Achse</label><input type="number" id="KL_axis" value="0" step="1">
    </div>

    <div id="KL_backfront" class="KL_block hide">
        <label>Rückfläche</label><input type="number" id="KL_back" value="0" step="0.01">
        <label>Vorderfläche</label><input type="number" id="KL_front" value="0" step="0.01">
    </div>

    <h4>Exzentrizität</h4>
    <input type="number" id="KL_Q" value="0.3" step="0.01">

    <h4>Mehrkurviges Design</h4>
    <div id="KL_multi">
        <div class="curveRow">
            <label>Meridian</label><input type="number" class="KL_meridian">
            <label>Radius</label><input type="number" class="KL_radius" value="8" step="0.01">
        </div>
    </div>

    <button id="KL_addCurve">+</button>

    <h4>Bevel</h4>
    <label>Bevelbreite (mm)</label><input type="number" id="KL_bevel_width" value="1" step="0.01">
    <label>Bevelradius (mm)</label><input type="number" id="KL_bevel_radius" value="10" step="0.01">

</div>

		<h2>3D‑Visualisierung</h2>

		<label>
		    <input type="checkbox" id="showCornea" checked>
		    Hornhaut anzeigen
		</label>
		
		<label>
		    <input type="checkbox" id="showKL" checked>
		    Kontaktlinse anzeigen
		</label>

		<div id="rendererCanvas" 
		     style="max-width: 700px; height: 600px; border: 1px solid #ccc; margin-top: 20px;">
		</div>
		
		<button id="updateRenderer" type="button">Visualisierung aktualisieren</button>

    
    
    
        <details>
        <summary>Rundung auswählen: </summary>
        
        <br>
        <input type="radio" id="round25" name="rounding" value="4" checked> 
        <label for="round25">0,25</label>
        
        <input type="radio" id="round12" name="rounding" value="8"> 
        <label for="round12">0,12</label>
        
        <input type="radio" id="round01" name="rounding" value="100"> 
        <label for="round01">0,01</label>
        
        </details>
        </div>
	</form>
        </body>
   <footer>
    <p>Alle Angaben ohne Gewähr.</p>
  <span id="footer"></span>
</footer>

    </script>

</html>
